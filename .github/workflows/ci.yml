name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev,app,web,ai]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  image:
    # The pilot's server runs this image behind Caddy (D75): it must build, answer
    # /health, and the files that run it must be valid.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --tag study-plan .
      - name: Start and ask /health
        run: |
          docker run --detach --name app --publish 8000:8000 study-plan
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - name: Compose and Caddy files are valid
        run: |
          cp deploy/hetzner/env.example deploy/hetzner/.env
          sed -i 's/^CPS_DOMAIN=$/CPS_DOMAIN=plan.example.com/' deploy/hetzner/.env
          docker compose -f deploy/hetzner/compose.yaml config --quiet
          docker run --rm -e CPS_DOMAIN=plan.example.com \
            -v "$PWD/deploy/hetzner/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Scripts parse
        run: bash -n deploy/hetzner/deploy.sh

  test:
    # Windows is in the matrix because the project was developed on Linux and is
    # used on Windows: AUDIT.md item 21 lists four defects only Windows exposes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,app,web,ai]"
      - name: Test (all, including slow)
        run: python -m pytest -m "slow or not slow" --cov=cps --cov-report=term
      - name: Demo (quick)
        # Redirected on purpose: a redirected stdout on Windows is cp1252 unless
        # console.ensure_utf8_output() does its job (AUDIT.md item 21).
        run: python demo.py --quick > demo.txt
      - name: Export has no stray CR
        # bash on both systems, so the quoting is the same; the file is still
        # written by Python on Windows, which is what this checks.
        shell: bash
        run: >
          cps plan examples/sample-timetable.ics --from 2026-03-02 --tz Europe/Rome
          --subject "Analysis:2:7" --out plan.ics &&
          python -c "import sys; b = open('plan.ics', 'rb').read(); sys.exit(1 if b'\r\r\n' in b else 0)"
