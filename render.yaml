# Render Blueprint for the hosted pilot (docs/ROADMAP.md, D3; steps in docs/DEPLOY.md).
# One web service with one disk: the SQLite store and its backups live on the disk,
# so the service runs as a single instance. Nothing here is a secret; the
# settings marked `sync: false` are typed in Render's dashboard.
services:
  - type: web
    name: study-plan
    runtime: python
    region: frankfurt # data stays in the EU (D6)
    plan: starter # a disk needs a paid instance
    buildCommand: pip install ".[web,ai]"
    startCommand: cps web --host 0.0.0.0 --behind-proxy --db /var/data/cps.sqlite
    healthCheckPath: /health
    autoDeploy: false # deploy on purpose, from the dashboard, after CI is green
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: CPS_BACKUP_DIR
        value: /var/data/backups
      - key: CPS_CONTACT # the e-mail address the privacy page names
        sync: false
      - key: CPS_BASE_URL # only with a custom domain; else Render's own address is used
        sync: false
      - key: CPS_ADMIN_TOKEN # the owner's review page, /admin/<token>; 24 characters or more
        sync: false
      - key: ANTHROPIC_API_KEY # optional: AI (D12); empty, the rules answer
        sync: false
      - key: CPS_AI_MONTHLY_CAP_USD # dollars a month, all students together
        value: "10"
