{% extends "base.html" %}
{% block title %}Delete · Study plan{% endblock %}
{% block main %}
<h1>Delete everything?</h1>
<p>Your plan, your timetable (and its link), your deadlines, your activities and every
session you reported are deleted at once. This cannot be undone.</p>
<form method="post" action="/p/{{ token }}/delete">
  <button type="submit" class="danger">Delete everything</button>
</form>
<p><a href="/p/{{ token }}/settings">Keep my plan</a></p>
{% endblock %}
