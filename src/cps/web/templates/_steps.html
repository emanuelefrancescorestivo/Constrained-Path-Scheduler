{# The onboarding progress: `step` is 1 to 4. #}
<ol class="steps" aria-label="Setting up, step {{ step }} of 4">
  {% for name in ("Timetable", "Exams and deadlines", "Your week", "Your calendar") %}
  <li class="{% if loop.index < step %}done{% elif loop.index == step %}current{% endif %}">{{ name }}</li>
  {% endfor %}
</ol>
