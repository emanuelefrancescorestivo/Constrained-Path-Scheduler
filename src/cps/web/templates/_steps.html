{# The onboarding progress (D98): `step` is 1 to 3; Today comes after. #}
<ol class="steps" aria-label="{{ _('Setting up, step {step} of 3', step=step) }}">
  {% for name in (_("Timetable"), _("Your exams"), _("Your week")) %}
  <li class="{% if loop.index < step %}done{% elif loop.index == step %}current{% endif %}">{{ name }}</li>
  {% endfor %}
</ol>
