<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="How the study planner works, from timetable to calendar" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>How the study planner works, from timetable to calendar</title>
<rect width="800" height="300" rx="12" fill="#fcfcfb"/>
<text x="24.0" y="34.0" font-size="16" font-weight="650" fill="#0b0b0b" text-anchor="start">From your timetable back to your calendar</text>
<text x="24.0" y="54.0" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Every front end calls one API, cps.service.</text>
<rect x="12.0" y="96" width="176" height="96" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="24.0" y="120.0" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">Your timetable</text>
<text x="24.0" y="140.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">a .ics file or its link:</text>
<text x="24.0" y="156.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">ADE, Hyperplanning, Google</text>
<text x="24.0" y="182.0" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">calendar_io.py, sources.py</text>
<rect x="212.0" y="96" width="176" height="96" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="224.0" y="120.0" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">What it says</text>
<text x="224.0" y="140.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">courses, lectures, exams,</text>
<text x="224.0" y="156.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">and the free time left</text>
<text x="224.0" y="182.0" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">calendar_io.py, timegrid.py</text>
<line x1="192.0" y1="144.0" x2="206.0" y2="144.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<path d="M208.0,144.0 l-7,-4.5 v9 z" fill="#52514e"/>
<rect x="412.0" y="96" width="176" height="96" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="424.0" y="120.0" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">The assistant plans</text>
<text x="424.0" y="140.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">deadlines, exam practice,</text>
<text x="424.0" y="156.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">self-tests as recall fades</text>
<text x="424.0" y="182.0" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">assistant.py, memory.py</text>
<line x1="392.0" y1="144.0" x2="406.0" y2="144.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<path d="M408.0,144.0 l-7,-4.5 v9 z" fill="#52514e"/>
<rect x="612.0" y="96" width="176" height="96" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
<text x="624.0" y="120.0" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">In your calendar</text>
<text x="624.0" y="140.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">a feed to subscribe to,</text>
<text x="624.0" y="156.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">a week you can drag</text>
<text x="624.0" y="182.0" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">feed.py, web/</text>
<line x1="592.0" y1="144.0" x2="606.0" y2="144.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/>
<path d="M608.0,144.0 l-7,-4.5 v9 z" fill="#52514e"/>
<path d="M700.0,194.0 L700.0,218.0 L500.0,218.0 L500.0,200.0" fill="none" stroke="#2a78d6" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M500.0,195.0 l-4.5,7 h9 z" fill="#2a78d6"/>
<text x="600.0" y="234.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">one tap after each session: done, skipped, hard</text>
<rect x="12.0" y="252.0" width="376" height="34" rx="8" fill="none" stroke="#52514e" stroke-width="1" stroke-dasharray="4 4"/>
<text x="24.0" y="273.0" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="start">Research reference: FSRS + AO* search (plan.py, rolling.py)</text>
<text x="400.0" y="273.0" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">checks that the assistant's rules are good enough</text>
</svg>
